<!doctype html>
<html lang="en" data-company-lang="{{onestead_lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{onestead_name}}</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/i18n-zh.js" defer></script>
<script src="/static/i18n-en.js" defer></script>
<script src="/static/i18n.js" defer></script>
<script src="/static/values.js" defer></script>
<script src="/static/app.js" defer></script>
<script src="/static/todos.js" defer></script>
<script src="/static/apps.js" defer></script>
<script src="/static/skills.js" defer></script>
<script src="/static/manage.js" defer></script>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><img src="/static/icon.svg" alt=""><span id="brand-name">{{onestead_name}}</span></div>
    <button class="find" id="open-search" type="button" hidden data-i18n-aria="app.095">
      <svg class="i" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.6"/><path d="m10.4 10.4 3.1 3.1"/></svg><span class="find-label" data-i18n="app.095"></span><kbd>Ctrl K</kbd>
    </button>
    <nav class="nav" hidden>
      <a href="#/" data-route="home">
        <svg class="i" viewBox="0 0 16 16"><path d="M2.5 7 8 2.5 13.5 7v6.5h-3.5v-4h-4v4H2.5z"/></svg><span class="nav-label" data-i18n="nav.home"></span></a>
      <a href="#/activity" data-route="activity">
        <svg class="i" viewBox="0 0 16 16"><path d="M1.8 8.5h2.7l1.9-4.6 3.2 8.2 1.9-3.6h2.7"/></svg><span class="nav-label" data-i18n="app.007"></span></a>
      <a href="#/todos" data-route="todos">
        <svg class="i" viewBox="0 0 16 16"><rect x="2.3" y="3" width="11.4" height="10.7" rx="2"/><path d="M2.3 6.4h11.4M5.4 1.8v2.4M10.6 1.8v2.4"/></svg><span class="nav-label" data-i18n="todos.008"></span></a>
      <div class="group" data-i18n="nav.company"></div>
      <a href="#/projects" data-route="projects">
        <svg class="i" viewBox="0 0 16 16"><path d="M2.2 4.3h4.3l1.4 1.6h5.9v6.8H2.2z"/></svg><span class="nav-label" data-i18n="app.008"></span></a>
      <a href="#/apps" data-route="apps">
        <svg class="i" viewBox="0 0 16 16"><rect x="2.4" y="2.4" width="4.6" height="4.6" rx="1.2"/><rect x="9" y="2.4" width="4.6" height="4.6" rx="1.2"/><rect x="2.4" y="9" width="4.6" height="4.6" rx="1.2"/><rect x="9" y="9" width="4.6" height="4.6" rx="1.2"/></svg><span class="nav-label" data-i18n="apps.034"></span></a>
      <a href="#/agents" data-route="agents">
        <svg class="i" viewBox="0 0 16 16"><rect x="3" y="4.6" width="10" height="8.2" rx="2.4"/><path d="M8 4.6V2.4M6 8.4v.6M10 8.4v.6M6.2 11h3.6"/></svg><span class="nav-label" data-i18n="apps.027"></span></a>
      <a href="#/skills" data-route="skills">
        <svg class="i" viewBox="0 0 16 16"><path d="M8 1.9 9.7 6l4.3.3-3.3 2.8 1 4.2L8 11l-3.7 2.3 1-4.2L2 6.3 6.3 6z"/></svg><span class="nav-label" data-i18n="skills.003"></span></a>
      <a href="#/docs" data-route="docs">
        <svg class="i" viewBox="0 0 16 16"><path d="M4 1.9h5.4L12.5 5v9.1H4z"/><path d="M9.2 1.9V5.2h3.3M6 8.4h4.4M6 11h4.4"/></svg><span class="nav-label" data-i18n="manage.115"></span></a>
      <a href="#/decisions" data-route="decisions">
        <svg class="i" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.8"/><path d="m5.5 8.1 1.8 1.8 3.3-3.6"/></svg><span class="nav-label" data-i18n="manage.092"></span></a>
      <a href="#/members" data-route="members">
        <svg class="i" viewBox="0 0 16 16"><circle cx="6" cy="5.6" r="2.4"/><path d="M1.9 13.4c.4-2.3 2-3.6 4.1-3.6s3.7 1.3 4.1 3.6"/><path d="M10.6 3.4a2.3 2.3 0 0 1 0 4.4M12 9.9c1.2.5 1.9 1.6 2.1 3.2"/></svg><span class="nav-label" data-i18n="app.144"></span></a>
      <a href="#/approvals" data-route="approvals">
        <svg class="i" viewBox="0 0 16 16"><path d="M8 1.9 13.3 4v4c0 3-2.2 5.2-5.3 6.1C4.9 13.2 2.7 11 2.7 8V4z"/><path d="m5.7 8 1.6 1.6 3-3.2"/></svg><span class="nav-label" data-i18n="manage.007"></span><b class="count" id="nav-pending" hidden></b></a>
    </nav>
    <div class="language-picker"><select id="language" data-i18n-aria="nav.language"><option value="zh" data-i18n="nav.chinese"></option><option value="en" data-i18n="nav.english"></option></select></div>
    <div class="me">
      <span class="avatar self" id="me-initial"></span>
      <div><b id="me-name" data-i18n="app.162"></b><span id="me-role"></span></div>
      <button class="btn ghost small" id="logout" type="button" hidden data-i18n="nav.logout"></button>
    </div>
  </aside>
  <main class="main" id="main"><div class="page" id="page"></div></main>
</div>
<div id="layer"></div>
</body>
</html>
