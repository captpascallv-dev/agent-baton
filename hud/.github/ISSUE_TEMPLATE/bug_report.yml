name: Bug report
description: Report a reproducible problem without sharing private Codex data
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "请勿上传真实会话、thread ID、绝对路径、数据库、日志正文或凭据。"
  - type: input
    id: version
    attributes:
      label: Version
      description: The GitHub Release version or commit
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11 x64
        - Windows 10 x64
        - Other / unsupported
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic or redacted values only
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed prompts, responses, credentials, full paths, thread IDs, and private databases.
          required: true
